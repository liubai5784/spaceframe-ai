<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空间刚架智能计算 Agent</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Roboto','PingFang SC','Microsoft YaHei',Arial,sans-serif;
         background: #F4F3EE; color: #1A1B1C; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 20px; background: #fff; border-bottom: 1px solid #E4E3DD;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { font-size: 12px; color: #6B7280; }
  .llm-badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; }
  .llm-on { background: rgba(82,196,26,.15); color: #389e0d; }
  .llm-off { background: rgba(250,173,20,.15); color: #d48806; }

  main { flex: 1; display: flex; min-height: 0; }
  #viewer { flex: 1; position: relative; background: #fff; }
  #viewer canvas { display: block; }
  #viewer .hint { position: absolute; bottom: 12px; left: 12px; font-size: 12px;
                  color: #9ca3af; background: rgba(255,255,255,.8); padding: 4px 10px;
                  border-radius: 8px; pointer-events: none; }

  #panel { width: 360px; min-width: 300px; background: #fff; border-left: 1px solid #E4E3DD;
           display: flex; flex-direction: column; }
  .chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; font-size: 13px;
         line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #9BBBF4; color: #fff; }
  .msg.agent { align-self: flex-start; background: #F4F3EE; border: 1px solid #E4E3DD; }
  .msg.loading { color: #6B7280; font-size: 12px; }

  .result-box { margin-top: 10px; border-top: 1px dashed #E4E3DD; padding-top: 8px; font-size: 12.5px; }
  .result-box .row { display: flex; justify-content: space-between; padding: 2px 0; }
  .ok { color: #389e0d; font-weight: 600; }
  .bad { color: #EA6668; font-weight: 600; }

  .inputbar { border-top: 1px solid #E4E3DD; padding: 10px; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; border: 1px solid #E4E3DD; border-radius: 10px; padding: 8px 10px;
             font-size: 13px; resize: none; height: 40px; font-family: inherit; outline: none; }
  textarea:focus { border-color: #9BBBF4; }
  .btn { border: none; border-radius: 10px; padding: 8px 14px; font-size: 13px;
         cursor: pointer; background: #9BBBF4; color: #fff; font-weight: 500; }
  .btn:hover { opacity: .9; }
  .btn.ghost { background: #fff; color: #1A1B1C; border: 1px solid #E4E3DD; }

  /* 面板页签 */
  .tabs { display: flex; border-bottom: 1px solid #E4E3DD; background: #FAFAF8; }
  .tab { flex: 1; padding: 8px 0; text-align: center; font-size: 13px; color: #6B7280;
         cursor: pointer; border-bottom: 2px solid transparent; user-select: none; }
  .tab.active { color: #1A1B1C; font-weight: 600; border-bottom-color: #9BBBF4; background: #fff; }
  .tabpane { display: none; flex: 1; min-height: 0; }
  .tabpane.active { display: flex; flex-direction: column; }

  /* 自由建模面板 */
  #paneModel { padding: 10px; gap: 8px; }
  #paneModel textarea { height: auto; flex: 1; font-family: Consolas, monospace;
                        font-size: 12px; line-height: 1.45; resize: vertical; min-height: 160px;
                        background: #FBFBF9; }
  .modelbar { display: flex; gap: 8px; align-items: center; }
  .modelbar .tip { font-size: 11px; color: #9ca3af; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid #F0EFEA; }
  th:first-child, td:first-child { text-align: left; }
  th { color: #6B7280; font-weight: 500; }
  td.bad { color: #EA6668; }

  @media (max-width: 760px) {
    main { flex-direction: column-reverse; }
    #panel { width: 100%; min-width: 0; max-height: 45vh; border-left: none; border-top: 1px solid #E4E3DD; }
  }
</style>
</head>
<body>
<header>
  <h1>空间刚架智能计算 Agent</h1>
  <span class="sub">基于 AI 的空间刚架智能计算 Agent 开发（课程项目）</span>
  <span id="llmBadge" class="llm-badge llm-off">规则模式</span>
</header>

<main>
  <div id="viewer" style="position:relative;">
    <div class="hint">鼠标拖拽旋转 · 滚轮缩放 · 右键平移</div>
  </div>

  <div id="panel">
    <div class="tabs">
      <div class="tab active" id="tabChat">💬 对话建模</div>
      <div class="tab" id="tabModel">📐 自由建模</div>
    </div>

    <div class="tabpane active" id="paneChat">
      <div class="chat" id="chat">
        <div class="msg agent">你好！我是空间刚架智能计算助手。你可以：
· 用自然语言描述结构，例如：<i>"做一个 8×6×4m 的两层刚架，柱 HW300，梁 HN400，顶部荷载 20kN/m²"</i>
· 描述任意构型，例如：<i>"一个 6m 高的四角锥塔架，底部四角固定，顶部受 200kN 竖向荷载"</i>
· 或者上传 SAP2000 导出的 .s2k 模型文件</div>
      </div>
      <div class="inputbar">
        <button class="btn ghost" id="btnUpload" title="上传 .s2k 文件">📂</button>
        <textarea id="input" placeholder="描述你的空间刚架…（回车发送）"></textarea>
        <button class="btn" id="btnSend">分析</button>
      </div>
    </div>

    <div class="tabpane" id="paneModel">
      <textarea id="modelInput" spellcheck="false"
        placeholder='粘贴任意构型的模型 JSON，如：
{
  "units": {"length": "m", "force": "kN"},
  "nodes": [ {"id":1,"x":0,"y":0,"z":0}, {"id":2,"x":6,"y":0,"z":0} ],
  "members": [ {"i":1,"j":2,"section":"HW200"} ],
  "supports": [ {"node":1} ],
  "nodal_loads": [ {"node":2,"fz":-100} ],
  "steel_grade": "Q355"
}'></textarea>
      <div class="modelbar">
        <span class="tip">节点坐标 m（或 units 指定 mm），力 kN（或 N），fix 可省略=全固定</span>
        <button class="btn ghost" id="btnExample">填入示例</button>
        <button class="btn" id="btnModel">计算</button>
      </div>
    </div>
  </div>
</main>

<input type="file" id="fileInput" accept=".s2k,.$2k,.txt" style="display:none">

<script src="./vendor/three.min.js"></script>
<script src="./vendor/OrbitControls.js"></script>

<script>
(function() {
'use strict';
// ---------------- 3D 场景 ----------------
const viewer = document.getElementById('viewer');
  if (typeof THREE === 'undefined') {
  viewer.innerHTML = '<div style="padding:40px;color:#6B7280;font-size:14px;text-align:center;">3D 引擎加载失败，请检查网络后刷新</div>';
  return;
}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);

// WebGL 渲染器（带降级：无 GPU 环境自动切 2D 画布）
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) {
  try { renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'low-power' }); }
  catch (e2) { renderer = null; }
}

let use2D = !renderer;
let controls = null;
if (use2D) {
    const cv = document.createElement('canvas');
  cv.width = viewer.clientWidth || 800;
  cv.height = viewer.clientHeight || 600;
  cv.style.width = '100%'; cv.style.height = '100%';
  viewer.insertBefore(cv, viewer.firstChild);
  window.__cv2d = cv;
} else {
    viewer.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

  // 灯光
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(5, 8, 6);
  scene.add(dirLight);

  // 地面网格
  const grid = new THREE.GridHelper(20, 20, 0xcccccc, 0xeeeeee);
  window.__grid = grid;
  scene.add(grid);

  // 轴
  scene.add(new THREE.AxesHelper(2));
}

function fitCamera(box) {
  // box 为结构坐标 (x,y,z)，z 是高度；Three.js y-up -> 相机目标换成 (cx, cz, cy)
  const cx = (box[0] + box[3]) / 2, cy = (box[1] + box[4]) / 2, cz = (box[2] + box[5]) / 2;
  const r = Math.max(box[3]-box[0], box[4]-box[1], box[5]-box[2], 1) * 1.6;
  camera.position.set(cx + r*0.6, cz + r*0.8, cy + r);
  camera.lookAt(cx, cz, cy);
  if (controls) { controls.target.set(cx, cz, cy); controls.update(); }
  if (window.__grid) {
    window.__grid.position.y = box[2];
    window.__grid.scale.set(Math.max(r/5, 1), 1, Math.max(r/5, 1));
  }
}

// ---------------- 渲染模型 ----------------
let modelGroup = null;

function colorForRatio(r) {
  const t = Math.min(Math.max(r / 1.5, 0), 1);
  const c = new THREE.Color();
  c.lerpColors(new THREE.Color(0x52C41A), new THREE.Color(0xFAAD14), Math.min(t*2, 1));
  if (t > 0.5) c.lerpColors(new THREE.Color(0xFAAD14), new THREE.Color(0xEA6668), (t-0.5)*2);
  return c;
}

function cssColor(r) {
  // 与 3D 同款的绿->黄->红
  const t = Math.min(Math.max(r / 1.5, 0), 1);
  const lerp = (a, b, k) => Math.round(a + (b - a) * k);
  let R, G, B;
  if (t <= 0.5) { R = lerp(0x52, 0xFA, t*2); G = lerp(0xC4, 0xAD, t*2); B = lerp(0x1A, 0x14, t*2); }
  else { const k = (t-0.5)*2; R = lerp(0xFA, 0xEA, k); G = lerp(0xAD, 0x66, k); B = lerp(0x14, 0x68, k); }
  return 'rgb(' + R + ',' + G + ',' + B + ')';
}

// 2D 降级渲染：等轴投影画杆件线框（按应力比着色）
function renderModel2D(data) {
  const cv = window.__cv2d;
  if (!cv) return;
  const W = cv.width, H = cv.height;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  const m = data.model;
  const nodes = new Map(m.nodes.map(n => [n.id, n]));
  const box = [1e9, 1e9, 1e9, -1e9, -1e9, -1e9];
  for (const n of m.nodes) {
    box[0]=Math.min(box[0],n.x); box[1]=Math.min(box[1],n.y); box[2]=Math.min(box[2],n.z);
    box[3]=Math.max(box[3],n.x); box[4]=Math.max(box[4],n.y); box[5]=Math.max(box[5],n.z);
  }
  const cx = (box[0]+box[3])/2, cy = (box[1]+box[4])/2, cz = (box[2]+box[5])/2;
  const r = Math.max(box[3]-box[0], box[4]-box[1], box[5]-box[2], 1);
  const s = Math.min(W, H) * 0.75 / r;
  const disp = m.displacements || {};
  const scale = m.deformed_scale || 0;
  const rotY = Math.PI / 6, rotX = -Math.PI / 7;
  const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
  function proj(n) {
    const d = disp[n.id] || [0,0,0];
    // 结构坐标 (x,y,z)，z 为高度 -> 高度走原 y 通道（屏幕垂直），y 走原 z 通道
    let x = (n.x + d[0]*scale) - cx, y = (n.z + d[2]*scale) - cz, z = (n.y + d[1]*scale) - cy;
    let x1 = x * cosY + z * sinY;
    let z1 = -x * sinY + z * cosY;
    let y1 = y * cosX - z1 * sinX;
    let z2 = y * sinX + z1 * cosX;
    return [W/2 + x1 * s, H/2 + y1 * s, z2];
  }
  const P = new Map();
  for (const n of m.nodes) P.set(n.id, proj(n));
  // 杆件（按应力比着色 + 编号）
  ctx.font = '11px sans-serif';
  for (const mb of m.members) {
    const a = P.get(mb.i), b = P.get(mb.j);
    if (!a || !b) continue;
    ctx.strokeStyle = cssColor(mb.max_ratio);
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    // 杆件标号
    ctx.fillStyle = mb.ok ? 'rgba(30,30,30,0.75)' : '#c0392b';
    ctx.fillText('#' + mb.id, (a[0]+b[0])/2 + 4, (a[1]+b[1])/2 - 6);
  }
  // 节点
  for (const n of m.nodes) {
    const p = P.get(n.id);
    ctx.fillStyle = '#9BBBF4';
    ctx.beginPath(); ctx.arc(p[0], p[1], 4, 0, Math.PI*2); ctx.fill();
  }
  // 图例
  ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = '#6B7280';
  ctx.fillText('2D 视图（WebGL 不可用时的降级显示）', 12, H - 12);
  // 最大应力杆件标注（确有受力时才显示）
  const worst = data.result && data.result.worst_member;
  if (worst && data.result.worst_ratio > 0.001) {
    const mb = m.members.find(x => x.id === worst);
    if (mb) {
      const a = P.get(mb.i), b = P.get(mb.j);
      ctx.fillStyle = '#EA6668';
      ctx.fillText('最不利杆件 #' + worst + '（应力比 ' + data.result.worst_ratio + '）',
                   (a[0]+b[0])/2 + 8, (a[1]+b[1])/2 - 8);
    }
  }
  window.__P2D = P;
  window.__lastData = data;
}

// 2D：点击 -> 找最近杆件
function pointSegDist(px, py, ax, ay, bx, by) {
  const dx = bx-ax, dy = by-ay;
  const L2 = dx*dx + dy*dy;
  let t = L2 > 0 ? ((px-ax)*dx + (py-ay)*dy)/L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
if (use2D) {
  window.__cv2d.addEventListener('click', function(ev) {
    const P = window.__P2D, data = window.__lastData;
    if (!P || !data) return;
    const rect = window.__cv2d.getBoundingClientRect();
    const kx = window.__cv2d.width / rect.width, ky = window.__cv2d.height / rect.height;
    const px = (ev.clientX - rect.left) * kx, py = (ev.clientY - rect.top) * ky;
    let best = null, bestD = 12;
    for (const mb of data.model.members) {
      const a = P.get(mb.i), b = P.get(mb.j);
      if (!a || !b) continue;
      const d = pointSegDist(px, py, a[0], a[1], b[0], b[1]);
      if (d < bestD) { bestD = d; best = mb.id; }
    }
    if (best) {
      showMemberDetail(best, ev.clientX, ev.clientY);
      const ctx = window.__cv2d.getContext('2d');
      const mb = data.model.members.find(x => x.id === best);
      const a = P.get(mb.i), b = P.get(mb.j);
      ctx.strokeStyle = 'rgba(33,150,243,.9)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    } else hideDetail();
  });
}

function renderModel(data) {
  if (use2D) { renderModel2D(data); return; }
  if (modelGroup) { scene.remove(modelGroup); }
  modelGroup = new THREE.Group();
  const m = data.model;
  const nodes = new Map(m.nodes.map(n => [n.id, n]));
  const box = [1e9, 1e9, 1e9, -1e9, -1e9, -1e9];
  for (const n of m.nodes) {
    box[0]=Math.min(box[0],n.x); box[1]=Math.min(box[1],n.y); box[2]=Math.min(box[2],n.z);
    box[3]=Math.max(box[3],n.x); box[4]=Math.max(box[4],n.y); box[5]=Math.max(box[5],n.z);
  }
  const L = Math.max(box[3]-box[0], box[5]-box[2], 1);

  const scale = m.deformed_scale || 0;
  const disp = m.displacements || {};

  // 节点小球（结构坐标 (x,y,z)，z 为高度；Three.js 中 y 轴朝上 -> 交换 y/z）
  for (const n of m.nodes) {
    const d = disp[n.id] || [0,0,0];
    const sph = new THREE.Mesh(
      new THREE.SphereGeometry(L*0.008, 12, 12),
      new THREE.MeshStandardMaterial({ color: 0x9BBBF4 }));
    sph.position.set(n.x + d[0]*scale, n.z + d[2]*scale, n.y + d[1]*scale);
    modelGroup.add(sph);
  }

  // 杆件标号标签（sprite，始终面向相机）- 自适应尺寸
  function makeLabel(text, color, L) {
    const baseL = 10; // 基准结构尺寸，用于计算相对比例
    const s = Math.max(L / baseL, 0.5); // 缩放因子，最小0.5
    const cw = Math.round(120 * s);
    const ch = Math.round(44 * s);
    const fs = Math.round(26 * s);
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const g = c.getContext('2d');
    g.font = 'bold ' + fs + 'px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const tw = g.measureText(text).width;
    g.fillStyle = 'rgba(255,255,255,0.92)';
    const pad = Math.round(6 * s);
    const bx = Math.round(cw/2 - tw/2);
    const by = Math.round(ch/2 - fs/2);
    const bw = Math.round(tw + pad*2);
    const bh = Math.round(fs + pad);
    if (typeof g.roundRect === 'function') {
      g.beginPath();
      g.roundRect(bx - pad, by, bw, bh, Math.round(10 * s));
      g.fill();
    } else {
      g.fillRect(bx - pad, by, bw, bh);
    }
    g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = Math.max(Math.round(2 * s), 1); g.stroke();
    g.fillStyle = color || '#333';
    g.fillText(text, cw/2, ch/2);
    const tex = new THREE.CanvasTexture(c);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, transparent: true, depthTest: false, sizeAttenuation: true }));
    sp.scale.set(L*0.10, L*0.04, 1);
    return sp;
  }

  // 杆件（圆柱，按应力比着色）
  for (const mb of m.members) {
    const a = nodes.get(mb.i), b = nodes.get(mb.j);
    if (!a || !b) continue;
    const da = disp[mb.i] || [0,0,0], db = disp[mb.j] || [0,0,0];
    // 结构 (x,y,z) -> Three (x, z, y)
    const ax = a.x+da[0]*scale, ay = a.z+da[2]*scale, az = a.y+da[1]*scale;
    const bx = b.x+db[0]*scale, by = b.z+db[2]*scale, bz = b.y+db[1]*scale;
    const dx=bx-ax, dy=by-ay, dz=bz-az;
    const len = Math.sqrt(dx*dx+dy*dy+dz*dz);
    if (len < 1e-9) continue;
    const radius = L * 0.006;
    const cyl = new THREE.Mesh(
      new THREE.CylinderGeometry(radius, radius, len, 8),
      new THREE.MeshStandardMaterial({ color: colorForRatio(mb.max_ratio) }));
    cyl.position.set((ax+bx)/2, (ay+by)/2, (az+bz)/2);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),
      new THREE.Vector3(dx,dy,dz).normalize());
    cyl.userData.mid = mb.id;   // 点击识别用
    modelGroup.add(cyl);
    // 杆件标号
    const lb = makeLabel('#' + mb.id, mb.ok ? '#333' : '#c0392b', L);
    lb.position.set((ax+bx)/2, (ay+by)/2 + L*0.035, (az+bz)/2);
    lb.userData.mid = mb.id;   // 点标签也能选中
    modelGroup.add(lb);
  }

  window.__lastData = data;
  scene.add(modelGroup);
  fitCamera(box);
}

// ---------------- 点击杆件查看详情 ----------------
const detailBox = document.createElement('div');
detailBox.style.cssText =
  'position:absolute;display:none;min-width:210px;max-width:260px;background:#fff;' +
  'border:1px solid #d9d9d9;border-radius:12px;padding:10px 12px;font-size:12.5px;' +
  'box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:20;pointer-events:auto;line-height:1.5;';
viewer.appendChild(detailBox);

function showMemberDetail(mid, cx, cy) {
  const data = window.__lastData;
  if (!data) return;
  const mb = data.model.members.find(x => x.id === mid);
  if (!mb) return;
  const bad = !mb.ok;
  let h = '<div style="font-size:13.5px;font-weight:600;margin-bottom:6px;color:' +
          (bad ? '#c0392b' : '#1A1B1C') + '">杆件 #' + mb.id +
          (bad ? '（超限）' : '（合格）') + '</div>';
  const rows = [
    ['连接节点', mb.i + ' → ' + mb.j],
    ['轴力 N', mb.N_kN + ' kN'],
    ['弯矩 Mz', mb.Mz_kNm + ' kN·m'],
    ['强度应力比', mb.stress_ratio],
    ['稳定应力比', mb.stability_ratio],
    ['长细比 λ', mb.slenderness],
    ['控制应力比', mb.max_ratio],
  ];
  for (const r of rows) {
    h += '<div style="display:flex;justify-content:space-between;gap:14px;padding:1.5px 0;">' +
         '<span style="color:#6B7280;">' + r[0] + '</span><b>' + r[1] + '</b></div>';
  }
  h += '<div style="margin-top:6px;color:#9ca3af;font-size:11px;">点击空白处关闭</div>';
  detailBox.innerHTML = h;
  detailBox.style.display = 'block';
  const vr = viewer.getBoundingClientRect();
  let x = cx - vr.left + 14, y = cy - vr.top + 14;
  const dw = detailBox.offsetWidth, dh = detailBox.offsetHeight;
  if (x + dw > vr.width - 8) x = cx - vr.left - dw - 10;
  if (y + dh > vr.height - 8) y = vr.height - dh - 8;
  detailBox.style.left = Math.max(8, x) + 'px';
  detailBox.style.top = Math.max(8, y) + 'px';
}
function hideDetail() { detailBox.style.display = 'none'; }

// 3D：射线检测点击
let selectedObj = null;
function clearHighlight3D() {
  if (selectedObj && selectedObj.material) {
    selectedObj.material.emissive = new THREE.Color(0x000000);
    selectedObj = null;
  }
}
function highlight3D(mid) {
  clearHighlight3D();
  if (!modelGroup) return;
  modelGroup.traverse(function(o) {
    if (o.isMesh && o.userData && o.userData.mid === mid) {
      o.material.emissive = new THREE.Color(0x2196f3);
      o.material.emissiveIntensity = 0.55;
      selectedObj = o;
    }
  });
}
if (!use2D) {
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('click', function(ev) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = modelGroup ? raycaster.intersectObjects(modelGroup.children, false) : [];
    let mid = null;
    for (const hit of hits) {
      if (hit.object.userData && hit.object.userData.mid) { mid = hit.object.userData.mid; break; }
    }
    if (mid) { showMemberDetail(mid, ev.clientX, ev.clientY); highlight3D(mid); }
    else { hideDetail(); clearHighlight3D(); }
  });
}

// ---------------- 页签切换 ----------------
const tabChat = document.getElementById('tabChat');
const tabModel = document.getElementById('tabModel');
const paneChat = document.getElementById('paneChat');
const paneModel = document.getElementById('paneModel');

// ---------------- 自由建模 ----------------
const modelInput = document.getElementById('modelInput');
const btnExample = document.getElementById('btnExample');
const btnModel = document.getElementById('btnModel');

const EXAMPLE_SPEC = {
  units: { length: 'm', force: 'kN' },
  nodes: [
    { id: 1, x: -2, y: -2, z: 0 }, { id: 2, x: 2, y: -2, z: 0 },
    { id: 3, x: 2, y: 2, z: 0 }, { id: 4, x: -2, y: 2, z: 0 },
    { id: 5, x: 0, y: 0, z: 6 }
  ],
  members: [
    { i: 1, j: 2, section: 'HW200' }, { i: 2, j: 3, section: 'HW200' },
    { i: 3, j: 4, section: 'HW200' }, { i: 4, j: 1, section: 'HW200' },
    { i: 1, j: 5, section: 'HW150' }, { i: 2, j: 5, section: 'HW150' },
    { i: 3, j: 5, section: 'HW150' }, { i: 4, j: 5, section: 'HW150' }
  ],
  supports: [
    { node: 1 }, { node: 2 }, { node: 3 }, { node: 4 }
  ],
  nodal_loads: [ { node: 5, fz: -200 } ],
  steel_grade: 'Q355',
  ref_span: 6.0
};

btnExample.addEventListener('click', function() {
  modelInput.value = JSON.stringify(EXAMPLE_SPEC, null, 2);
});

async function analyzeModel() {
  const raw = modelInput.value.trim();
  if (!raw) { addMsg('agent', '⚠️ 请先粘贴模型 JSON，或点"填入示例"'); return; }
  let spec;
  try { spec = JSON.parse(raw); }
  catch (e) { addMsg('agent', '⚠️ JSON 格式错误：' + e.message); return; }
  switchTab('chat');
  addMsg('user', '📐 自由建模：' + (spec.nodes ? spec.nodes.length + ' 节点 / ' +
         (spec.members ? spec.members.length : 0) + ' 杆件' : '未知模型'));
  const loading = addMsg('loading', '分析中…');
  try {
    const resp = await fetch('/api/model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ spec: spec })
    });
    const json = await resp.json().catch(() => ({}));
    loading.remove();
    if (!resp.ok) {
      addMsg('agent', '⚠️ ' + (json.detail || ('请求失败（' + resp.status + '）')));
      return;
    }
    addMsg('agent', json.reply.replace(/\n/g, '<br>'));
    if (json.data && json.data.model && json.data.model.nodes) {
      renderModel(json.data);
      addMsg('agent', resultHtml(json.data));
    }
  } catch (e) {
    loading.remove();
    addMsg('agent', '分析失败：' + e.message);
  }
}

btnModel.addEventListener('click', analyzeModel);

// ---------------- 聊天与结果 ----------------
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const btnSend = document.getElementById('btnSend');
const btnUpload = document.getElementById('btnUpload');
const fileInput = document.getElementById('fileInput');

function addMsg(cls, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function resultHtml(data) {
  const r = data.result;
  let html = '<div class="result-box">';
  html += '<div class="row"><span>最大位移</span><b>' + r.max_displacement_mm + ' mm</b></div>';
  html += '<div class="row"><span>位移比</span><b>' + r.deflection_ratio + '</b></div>';
  html += '<div class="row"><span>安全判定</span><b class="' + (r.safe ? 'ok' : 'bad') + '">' +
          (r.safe ? '满足 GB50017 ✓' : '不满足 ✗') + '</b></div>';
  if (r.worst_member) {
    html += '<div class="row"><span>最不利杆件</span><b>' + r.worst_member + ' 号（应力比 ' + r.worst_ratio + '）</b></div>';
  }
  html += '</div>';
  html += '<table><tr><th>杆件</th><th>强度比</th><th>稳定比</th><th>λ</th><th>结论</th></tr>';
  for (const mb of data.model.members.slice(0, 30)) {
    html += '<tr><td>#' + mb.id + '</td><td>' + mb.stress_ratio + '</td><td>' + mb.stability_ratio +
            '</td><td>' + mb.slenderness + '</td><td class="' + (mb.ok ? '' : 'bad') + '">' +
            (mb.ok ? 'OK' : '超限') + '</td></tr>';
  }
  html += '</table>';
  return html;
}

async function analyze(text, file) {
  const loading = addMsg('loading', '分析中…');
  try {
    const fd = new FormData();
    if (file) { fd.append('file', file); }
    const url = file ? '/api/upload' : '/api/analyze';
    const opts = file ? { method: 'POST', body: fd }
                      : { method: 'POST', headers: {'Content-Type':'application/json'},
                          body: JSON.stringify({ text: text }) };
    const resp = await fetch(url, opts);
    const json = await resp.json().catch(() => ({}));
    loading.remove();
    if (!resp.ok) {
      addMsg('agent', '⚠️ ' + (json.detail || ('请求失败（' + resp.status + '）')));
      return;
    }
    addMsg('agent', json.reply.replace(/\n/g, '<br>'));
    if (json.data && json.data.model && json.data.model.nodes) {
      renderModel(json.data);
      addMsg('agent', resultHtml(json.data));
    }
  } catch (e) {
    loading.remove();
    addMsg('agent', '分析失败：' + e.message);
  }
}

btnSend.addEventListener('click', function() {
  const t = input.value.trim();
  if (!t) return;
  addMsg('user', t);
  input.value = '';
  analyze(t, null);
});
input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); btnSend.click(); }
});
btnUpload.addEventListener('click', function() { fileInput.click(); });
fileInput.addEventListener('change', function() {
  const f = fileInput.files[0];
  if (!f) return;
  addMsg('user', '📂 上传模型文件：' + f.name);
  analyze(null, f);
  fileInput.value = '';
});

// 渲染循环
function resize() {
  if (use2D) {
    const cv = window.__cv2d;
    if (cv) { cv.width = viewer.clientWidth || 800; cv.height = viewer.clientHeight || 600; }
    return;
  }
  const w = viewer.clientWidth, h = viewer.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
if (!use2D) {
  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}
})();
